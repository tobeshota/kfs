# 即時起動する（単体テストは対話的な設定を用いないため）
set timeout=0

# GRUBのデフォルトターミナルはグラフィカルコンソールgfxtermだが、
# UEFI環境でVGAモードが存在しない場合はエラーになる。
# そのため、テキストコンソールconsole
# （EFI_SIMPLE_TEXT_INPUT_PROTOCOL，EFI_SIMPLE_TEXT_OUTPUT_PROTOCOL）
# に固定する
terminal_input console
terminal_output console

menuentry "testImage" {
	multiboot2 /boot/testImage
	boot
}
