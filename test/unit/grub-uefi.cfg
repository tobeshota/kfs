# 即時起動する（単体テストは対話的な設定を用いないため）
set default=0
set timeout_style=hidden
set timeout=0

# 単体テストではQEMUの -serial stdio から結果を読むため，
# GRUBの入出力もserialへ固定してメニュー待ちを避ける。
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

# UEFIではBIOSのVGA text modeを前提にできないため，
# カーネルにはEFI GOP framebufferを引き継ぐ。
insmod efi_gop
insmod efi_uga
insmod video
set gfxpayload=keep

menuentry "testImage" {
	multiboot2 /boot/testImage
	boot
}
