name: Unit Test

on: push

jobs:
  Ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install dependencies
        run:  sudo apt-get update && sudo apt-get install -y qemu-system-x86 grub-pc-bin xorriso
      - name: Run unit test
        run: make unit -C test/
